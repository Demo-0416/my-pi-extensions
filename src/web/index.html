<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi-trace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">✻ pi-trace</div>
    <select id="session-picker" class="session-picker" title="历史会话"></select>
    <span id="session-title" class="session-title"></span>
    <span id="precision" class="precision"></span>
    <input id="search" class="search" type="search" placeholder="搜索（tool 名 / 命令 / 文本）" disabled>
  </header>

  <div id="stats" class="statsbar"></div>

  <!-- M9：4 泳道甘特图挂载点 -->
  <div id="timeline" class="timeline" hidden></div>

  <main class="main">
    <div id="ledger" class="ledger"></div>
    <div id="detail" class="detail" hidden></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
